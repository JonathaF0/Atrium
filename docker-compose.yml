services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrium}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atrium}"]
      interval: 5s
      timeout: 5s
      retries: 5

  atrium:
    # Built from this repository so the fork's features are included
    # (the published vibralabs/atrium image doesn't have them).
    build:
      context: .
      dockerfile: docker/unified.Dockerfile
    # Behind a tunnel or HTTPS proxy on the same machine, use "127.0.0.1:8082:8080"
    # so Atrium isn't reachable directly over plain HTTP (Docker bypasses ufw).
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:-atrium}@postgres:5432/${POSTGRES_DB:-atrium}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      # The public URL users open Atrium at, including the scheme. Required:
      # sign-in breaks without it behind any domain or reverse proxy.
      WEB_URL: "${WEB_URL}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      smtp-relay:
        condition: service_started

  # Sends mail through Microsoft 365 (Graph API). In Atrium's email settings,
  # use host "smtp-relay", port 25, no authentication. It is only reachable
  # from the other containers; no port is published.
  smtp-relay:
    image: ghcr.io/dmitaj/microsoft-365-smtp-relay:latest
    restart: unless-stopped
    environment:
      Graph_TenantId: "${MICROSOFT_TENANT_ID}"
      Graph_ClientId: "${MICROSOFT_CLIENT_ID}"
      Graph_ClientSecret: "${MICROSOFT_CLIENT_SECRET}"
      # The mailbox mail is sent from, e.g. portal@example.com.
      SendFrom: "${SMTP_RELAY_SEND_FROM}"
      Smtp_Host: "0.0.0.0"
      Smtp_Port: "25"
      LogLevel: "INFO"
      LogPath: "/var/log/smtp-relay"
    volumes:
      - smtp-relay-logs:/var/log/smtp-relay
    security_opt:
      - no-new-privileges:true

volumes:
  # Fixed names keep the existing database and uploads attached whatever the
  # project directory is called.
  pgdata:
    name: atrium-pgdata
  uploads:
    name: atrium-uploads
  smtp-relay-logs:
